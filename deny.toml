[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
all-features = true

[advisories]
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "rav1e 0.8.1 still requires paste 1.0.15; it is an unmaintained build-time macro dependency with no safe upstream upgrade" },
]

[licenses]
allow = ["0BSD", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "IJG", "Libpng", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "syn@2.0.119", reason = "rav1e's proc-macro dependencies require syn 2 while thiserror 2 requires syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
