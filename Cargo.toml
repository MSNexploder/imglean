[package]
name = "imglean"
version = "0.6.0"
edition = "2024"
description = "Run image optimizers and select the smallest verified candidate per input"
license = "Apache-2.0"
readme = "README.md"
keywords = ["image", "optimization", "compression", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
crc32fast = "=1.5.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
oxipng = { version = "=10.1.1", default-features = false, features = ["zopfli"] }
png = { version = "=0.18.1", default-features = false }
same-file = "=1.0.6"
zune-jpeg = { version = "=0.5.14", default-features = false, features = ["log", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
