[package]
name = "imglean"
version = "0.7.0"
edition = "2024"
description = "Run image optimizers and select the smallest verified candidate per input"
license = "Apache-2.0"
readme = "README.md"
keywords = ["image", "optimization", "compression", "cli"]
categories = ["command-line-utilities", "multimedia::images"]

[workspace]
members = ["crates/imglean-codecs"]
resolver = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
crc32fast = "=1.5.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
image-webp = "=0.2.4"
imglean-codecs = { version = "=0.1.0", path = "crates/imglean-codecs" }
oxipng = { version = "=10.2.1", default-features = false, features = ["zopfli"] }
png = { version = "=0.18.1", default-features = false }
same-file = "=1.0.6"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["log", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }
