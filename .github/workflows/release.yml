name: Release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  qualification:
    name: Complete CI qualification
    uses: ./.github/workflows/ci.yml

  compliance:
    name: Compliance records
    runs-on: ubuntu-24.04
    outputs:
      rust_version: ${{ steps.toolchain.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Resolve release Rust toolchain
        id: toolchain
        shell: bash
        run: echo "rust_version=$(rustc -V | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Verify release tag
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(mise exec -- python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Audit dependencies
        run: mise run audit
      - name: Generate notices and SBOM
        shell: bash
        run: |
          mise run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
          mise run sbom
          mise exec -- python -m json.tool target/imglean.spdx.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: compliance-records
          path: |
            THIRD_PARTY_NOTICES.md
            target/imglean.spdx.json

  package:
    name: Package (${{ matrix.target }})
    needs:
      - compliance
      - qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
    runs-on: ${{ matrix.os }}
    env:
      MISE_RUST_VERSION: ${{ needs.compliance.outputs.rust_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Select the single-configuration native generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - name: Install build tools
        run: mise install rust python
      - name: Run native qualification gate
        run: mise run check
      - name: Build target executable
        run: cargo build --locked --release --target ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: compliance-records
          path: target/compliance
      - name: Package release record
        run: >-
          mise exec -- python tools/package_release.py
          --target ${{ matrix.target }}
          --binary ${{ matrix.binary }}
          --sbom target/compliance/imglean.spdx.json
          --notices target/compliance/THIRD_PARTY_NOTICES.md
          --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: imglean-${{ matrix.target }}
          path: dist/*

  container:
    name: Container (linux/amd64)
    needs:
      - compliance
      - qualification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build minimal container
        shell: bash
        run: |
          builder="docker.io/library/rust:${{ needs.compliance.outputs.rust_version }}-bookworm"
          builder_digest=$(docker buildx imagetools inspect "$builder" | awk '/^Digest:/ { print $2; exit }')
          test -n "$builder_digest"
          runtime=$(awk '/^FROM gcr.io\/distroless\// { print $2; exit }' Dockerfile)
          {
            echo "rust_version=${{ needs.compliance.outputs.rust_version }}"
            echo "builder=$builder@$builder_digest"
            echo "runtime=$runtime"
            echo "source_commit=$GITHUB_SHA"
            docker version --format 'docker_client={{.Client.Version}} docker_server={{.Server.Version}}'
          } > container-build-inputs.txt
          docker build \
            --build-arg RUST_IMAGE="$builder@$builder_digest" \
            --build-arg VERSION=${GITHUB_REF_NAME:-dev} \
            --build-arg SOURCE_COMMIT=$GITHUB_SHA \
            --build-arg SOURCE_REPOSITORY=$GITHUB_REPOSITORY \
            --platform linux/amd64 \
            --tag imglean-release:$GITHUB_SHA \
            .
      - name: Smoke-test container
        shell: bash
        run: |
          docker run --rm imglean-release:$GITHUB_SHA --version
          set +e
          docker run --rm \
            --volume "$PWD/tests/corpus/png/v2/accepted:/inputs:ro" \
            imglean-release:$GITHUB_SHA \
            --check /inputs/oxipng-reduction.png
          status=$?
          set -e
          test "$status" -eq 4
      - name: Save qualified container
        shell: bash
        run: docker save imglean-release:$GITHUB_SHA | gzip --no-name > imglean-linux-amd64.docker.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: imglean-container-linux-amd64
          path: |
            container-build-inputs.txt
            imglean-linux-amd64.docker.tar.gz

  publish:
    name: Publish qualified release
    if: github.event_name == 'push'
    needs:
      - package
      - container
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: imglean-x86_64-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: imglean-container-linux-amd64
          path: container
      - name: Add container build record
        run: cp container/container-build-inputs.txt release-assets/
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if state=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$state" = true
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release-assets/* \
              --verify-tag \
              --generate-notes \
              --draft \
              --title "ImgLean $GITHUB_REF_NAME"
          fi
      - name: Publish container image
        shell: bash
        run: |
          gzip --decompress --stdout container/imglean-linux-amd64.docker.tar.gz | docker load
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$repository"
          printf '%s' '${{ github.token }}' | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag imglean-release:$GITHUB_SHA "$image:$GITHUB_REF_NAME"
          docker tag imglean-release:$GITHUB_SHA "$image:latest"
          docker push "$image:$GITHUB_REF_NAME"
          docker push "$image:latest"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
