name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: Native gate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Select the single-configuration native generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - name: Install build tools
        run: mise install rust python
      - name: Run canonical gate
        run: mise run check
      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }}

  optipng-provider:
    name: OptiPNG external override (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            kind: source
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            kind: source
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            kind: source
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            kind: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Select the single-configuration native generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - name: Install build tools
        run: mise install rust python
      - name: Build ImgLean
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build pinned OptiPNG
        if: matrix.kind == 'source'
        id: optipng_source
        shell: bash
        run: |
          version=$(tr -d '\r\n' < ci/optipng-version.txt)
          archive="$RUNNER_TEMP/optipng.tar.gz"
          curl --fail --location --silent --show-error \
            "https://downloads.sourceforge.net/project/optipng/OptiPNG/optipng-${version}/optipng-${version}.tar.gz" \
            --output "$archive"
          echo "c2579be58c2c66dae9d63154edcb3d427fef64cb00ec0aff079c9d156ec46f29  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/optipng-${version}"
          ./configure
          make -j2
          provider="$RUNNER_TEMP/optipng-${version}/src/optipng/optipng"
          test -x "$provider"
          echo "path=$provider" >> "$GITHUB_OUTPUT"
      - name: Install pinned OptiPNG
        if: matrix.kind == 'windows'
        id: optipng_windows
        shell: pwsh
        run: |
          $version = (Get-Content ci/optipng-version.txt -Raw).Trim()
          $archive = Join-Path $env:RUNNER_TEMP "optipng-win64.zip"
          Invoke-WebRequest "https://downloads.sourceforge.net/project/optipng/OptiPNG/optipng-$version/optipng-$version-win64.zip" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "cdc632c21e11b2e0ba6f87a0df632f810827267f263b655002a849d3f87b06b2") { throw "OptiPNG checksum mismatch" }
          $destination = Join-Path $env:RUNNER_TEMP "optipng"
          Expand-Archive $archive -DestinationPath $destination
          $provider = (Get-ChildItem $destination -Recurse -Filter optipng.exe | Select-Object -First 1).FullName
          if (-not $provider) { throw "OptiPNG executable not found" }
          "path=$provider" >> $env:GITHUB_OUTPUT
      - name: Exercise discovery and real provider execution
        run: >-
          mise exec -- python tools/test_external_provider.py
          --binary ${{ matrix.binary }}
          --provider "${{ steps.optipng_source.outputs.path || steps.optipng_windows.outputs.path }}"

  pngquant-provider:
    name: pngquant ${{ matrix.pngquant }} adapter (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            extension: ""
            pngquant: "3.0.2"
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            extension: ""
            pngquant: "3.0.3"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            extension: ""
            pngquant: "3.0.2"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            extension: ""
            pngquant: "3.0.3"
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            extension: ""
            pngquant: "3.0.2"
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            extension: ""
            pngquant: "3.0.3"
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            extension: .exe
            pngquant: "3.0.2"
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            extension: .exe
            pngquant: "3.0.3"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Select the single-configuration native generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - name: Install build tools
        run: mise install rust python
      - name: Build ImgLean
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build supported pngquant
        id: pngquant
        shell: bash
        run: |
          root="$RUNNER_TEMP/pngquant-${{ matrix.pngquant }}"
          cargo install --locked --version "${{ matrix.pngquant }}" --root "$root" pngquant
          provider="$root/bin/pngquant${{ matrix.extension }}"
          test -f "$provider"
          echo "path=$provider" >> "$GITHUB_OUTPUT"
      - name: Exercise discovery and real provider execution
        run: >-
          mise exec -- python tools/test_pngquant_provider.py
          --binary ${{ matrix.binary }}
          --provider "${{ steps.pngquant.outputs.path }}"

  jpeg-providers:
    name: ${{ matrix.provider }} external override (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            provider: mozjpeg
            repository: mozilla/mozjpeg
            revision_file: ci/mozjpeg-revision.txt
            build_targets: cjpeg jpegtran
            provider_path: build/cjpeg
            jpegtran_path: build/jpegtran
            cmake_options: -DWITH_SIMD=OFF
            kind: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            provider: mozjpeg
            repository: mozilla/mozjpeg
            revision_file: ci/mozjpeg-revision.txt
            build_targets: cjpeg jpegtran
            provider_path: build/cjpeg
            jpegtran_path: build/jpegtran
            cmake_options: -DWITH_SIMD=OFF
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            provider: mozjpeg
            repository: mozilla/mozjpeg
            revision_file: ci/mozjpeg-revision.txt
            build_targets: cjpeg jpegtran
            provider_path: build/cjpeg
            jpegtran_path: build/jpegtran
            cmake_options: -DWITH_SIMD=OFF
            kind: unix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            provider: mozjpeg
            repository: mozilla/mozjpeg
            revision_file: ci/mozjpeg-revision.txt
            build_targets: cjpeg jpegtran
            provider_path: build/Release/cjpeg.exe
            jpegtran_path: build/Release/jpegtran.exe
            cmake_options: -DWITH_SIMD=OFF
            kind: windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            provider: jpegli
            repository: google/jpegli
            revision_file: ci/jpegli-revision.txt
            build_targets: cjpegli
            provider_path: build/tools/cjpegli
            jpegtran_path: ""
            cmake_options: -DJPEGLI_BUNDLE_LIBPNG=ON -DJPEGLI_ENABLE_BENCHMARK=OFF -DJPEGLI_ENABLE_DOXYGEN=OFF -DJPEGLI_ENABLE_JNI=OFF -DJPEGLI_ENABLE_MANPAGES=OFF -DJPEGLI_ENABLE_OPENEXR=OFF -DJPEGLI_ENABLE_SJPEG=OFF
            kind: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            provider: jpegli
            repository: google/jpegli
            revision_file: ci/jpegli-revision.txt
            build_targets: cjpegli
            provider_path: build/tools/cjpegli
            jpegtran_path: ""
            cmake_options: -DJPEGLI_BUNDLE_LIBPNG=ON -DJPEGLI_ENABLE_BENCHMARK=OFF -DJPEGLI_ENABLE_DOXYGEN=OFF -DJPEGLI_ENABLE_JNI=OFF -DJPEGLI_ENABLE_MANPAGES=OFF -DJPEGLI_ENABLE_OPENEXR=OFF -DJPEGLI_ENABLE_SJPEG=OFF
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            provider: jpegli
            repository: google/jpegli
            revision_file: ci/jpegli-revision.txt
            build_targets: cjpegli
            provider_path: build/tools/cjpegli
            jpegtran_path: ""
            cmake_options: -DJPEGLI_BUNDLE_LIBPNG=ON -DJPEGLI_ENABLE_BENCHMARK=OFF -DJPEGLI_ENABLE_DOXYGEN=OFF -DJPEGLI_ENABLE_JNI=OFF -DJPEGLI_ENABLE_MANPAGES=OFF -DJPEGLI_ENABLE_OPENEXR=OFF -DJPEGLI_ENABLE_SJPEG=OFF
            kind: unix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            provider: jpegli
            repository: google/jpegli
            revision_file: ci/jpegli-revision.txt
            build_targets: cjpegli
            provider_path: build/tools/Release/cjpegli.exe
            jpegtran_path: ""
            cmake_options: -DJPEGLI_BUNDLE_LIBPNG=ON -DJPEGLI_ENABLE_BENCHMARK=OFF -DJPEGLI_ENABLE_DOXYGEN=OFF -DJPEGLI_ENABLE_JNI=OFF -DJPEGLI_ENABLE_MANPAGES=OFF -DJPEGLI_ENABLE_OPENEXR=OFF -DJPEGLI_ENABLE_SJPEG=OFF
            kind: windows
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            provider: jpegtran
            repository: libjpeg-turbo/libjpeg-turbo
            revision_file: ci/libjpeg-turbo-revision.txt
            build_targets: jpegtran
            provider_path: build/jpegtran
            jpegtran_path: build/jpegtran
            cmake_options: -DWITH_SIMD=OFF
            kind: unix
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            provider: jpegtran
            repository: libjpeg-turbo/libjpeg-turbo
            revision_file: ci/libjpeg-turbo-revision.txt
            build_targets: jpegtran
            provider_path: build/jpegtran
            jpegtran_path: build/jpegtran
            cmake_options: -DWITH_SIMD=OFF
            kind: unix
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            provider: jpegtran
            repository: libjpeg-turbo/libjpeg-turbo
            revision_file: ci/libjpeg-turbo-revision.txt
            build_targets: jpegtran
            provider_path: build/jpegtran
            jpegtran_path: build/jpegtran
            cmake_options: -DWITH_SIMD=OFF
            kind: unix
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            provider: jpegtran
            repository: libjpeg-turbo/libjpeg-turbo
            revision_file: ci/libjpeg-turbo-revision.txt
            build_targets: jpegtran
            provider_path: build/Release/jpegtran.exe
            jpegtran_path: build/Release/jpegtran.exe
            cmake_options: -DWITH_SIMD=OFF
            kind: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Select the single-configuration native generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - name: Install build tools
        run: mise install rust python
      - name: Build ImgLean
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build representative provider revision
        id: provider_unix
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          revision=$(tr -d '\r\n' < "${{ matrix.revision_file }}")
          source="$RUNNER_TEMP/${{ matrix.provider }}"
          git clone --filter=blob:none --no-checkout "https://github.com/${{ matrix.repository }}.git" "$source"
          git -C "$source" checkout "$revision"
          if test "${{ matrix.provider }}" = jpegli; then
            git -C "$source" submodule update --init --recursive --depth 1
          fi
          cmake -S "$source" -B "$source/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF ${{ matrix.cmake_options }}
          cmake --build "$source/build" --config Release --target ${{ matrix.build_targets }} --parallel 2
          provider="$source/${{ matrix.provider_path }}"
          test -x "$provider"
          echo "path=$provider" >> "$GITHUB_OUTPUT"
          if test -n "${{ matrix.jpegtran_path }}"; then
            jpegtran="$source/${{ matrix.jpegtran_path }}"
            test -x "$jpegtran"
            echo "jpegtran_path=$jpegtran" >> "$GITHUB_OUTPUT"
          fi
      - name: Build representative provider revision
        id: provider_windows
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          $revision = (Get-Content "${{ matrix.revision_file }}" -Raw).Trim()
          $source = Join-Path $env:RUNNER_TEMP "${{ matrix.provider }}"
          git clone --filter=blob:none --no-checkout "https://github.com/${{ matrix.repository }}.git" $source
          git -C $source checkout $revision
          if ("${{ matrix.provider }}" -eq "jpegli") {
            git -C $source submodule update --init --recursive --depth 1
          }
          cmake -S $source -B "$source/build" -DBUILD_TESTING=OFF ${{ matrix.cmake_options }}
          cmake --build "$source/build" --config Release --target ${{ matrix.build_targets }} --parallel 2
          $provider = Join-Path $source "${{ matrix.provider_path }}"
          if (-not (Test-Path $provider -PathType Leaf)) { throw "provider executable not found" }
          "path=$provider" >> $env:GITHUB_OUTPUT
          if ("${{ matrix.jpegtran_path }}" -ne "") {
            $jpegtran = Join-Path $source "${{ matrix.jpegtran_path }}"
            if (-not (Test-Path $jpegtran -PathType Leaf)) { throw "jpegtran executable not found" }
            "jpegtran_path=$jpegtran" >> $env:GITHUB_OUTPUT
          }
      - name: Exercise discovery and real provider execution
        if: matrix.provider != 'jpegtran'
        run: >-
          mise exec -- python tools/test_jpeg_provider.py
          --binary ${{ matrix.binary }}
          --name ${{ matrix.provider }}
          --provider "${{ steps.provider_unix.outputs.path || steps.provider_windows.outputs.path }}"
      - name: Exercise lossless jpegtran discovery and execution
        if: matrix.provider == 'mozjpeg' || matrix.provider == 'jpegtran'
        run: >-
          mise exec -- python tools/test_jpegtran_provider.py
          --binary ${{ matrix.binary }}
          --provider "${{ steps.provider_unix.outputs.jpegtran_path || steps.provider_windows.outputs.jpegtran_path }}"

  libwebp-provider:
    name: libwebp external override (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
            provider: build/cwebp
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
            provider: build/cwebp
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
            provider: build/cwebp
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
            provider: build/cwebp.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
        with:
          install: false
      - name: Select the single-configuration native generator
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV'
      - name: Install build tools
        run: mise install rust python
      - name: Build ImgLean
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build pinned libwebp cwebp
        id: libwebp
        shell: bash
        run: |
          version=$(tr -d '\r\n' < ci/libwebp-version.txt)
          archive="$RUNNER_TEMP/libwebp.tar.gz"
          curl --fail --location --silent --show-error \
            "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-${version}.tar.gz" \
            --output "$archive"
          echo "e4ab7009bf0629fd11982d4c2aa83964cf244cffba7347ecd39019a9e38c4564  $archive" | shasum -a 256 --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          source="$RUNNER_TEMP/libwebp-${version}"
          cmake -S "$source" -B "$source/build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWEBP_BUILD_ANIM_UTILS=OFF \
            -DWEBP_BUILD_CWEBP=ON \
            -DWEBP_BUILD_DWEBP=OFF \
            -DWEBP_BUILD_GIF2WEBP=OFF \
            -DWEBP_BUILD_IMG2WEBP=OFF \
            -DWEBP_BUILD_VWEBP=OFF \
            -DWEBP_BUILD_WEBPINFO=OFF \
            -DWEBP_BUILD_WEBPMUX=OFF \
            -DWEBP_BUILD_EXTRAS=OFF
          cmake --build "$source/build" --config Release --target cwebp --parallel 2
          provider="$source/${{ matrix.provider }}"
          test -f "$provider"
          echo "path=$provider" >> "$GITHUB_OUTPUT"
      - name: Exercise discovery and real provider execution
        run: >-
          mise exec -- python tools/test_webp_provider.py
          --binary ${{ matrix.binary }}
          --provider "${{ steps.libwebp.outputs.path }}"

  compliance:
    name: Dependency and release records
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Verify generated PNG corpus
        shell: bash
        run: |
          mise exec -- python tools/generate_png_corpus.py
          changes=$(git status --porcelain --untracked-files=all -- tests/corpus/png/v2)
          if test -n "$changes"; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Verify generated JPEG corpus
        shell: bash
        run: |
          mise exec -- python tools/generate_jpeg_corpus.py
          changes=$(git status --porcelain --untracked-files=all -- tests/corpus/jpeg/v1)
          if test -n "$changes"; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Audit dependencies
        run: mise run audit
      - name: Verify generated notices
        shell: bash
        run: |
          mise run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Generate and validate SPDX SBOM
        shell: bash
        run: |
          mise run sbom
          mise exec -- python -m json.tool target/imglean.spdx.json >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: compliance-records
          path: |
            THIRD_PARTY_NOTICES.md
            target/imglean.spdx.json
