name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CMAKE_POLICY_VERSION_MINIMUM: "3.10"

jobs:
  native:
    name: Native gate (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      MISE_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: rust python
      - name: Set the supported macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
      - name: Configure Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/ci/windows-msvc.cmake" >> $env:GITHUB_ENV
      - name: Install Linux x86 assembler
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
      - name: Install macOS x86 assembler
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi
          brew install nasm
          echo "IMGLEAN_NASM=$(brew --prefix nasm)/bin/nasm" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ci/nasm" >> "$GITHUB_PATH"
      - name: Run canonical gate
        run: mise run check
      - name: Build release executable
        run: cargo build --locked --release --target ${{ matrix.target }}

  providers:
    name: External providers (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/imglean
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/imglean
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/imglean
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/imglean.exe
    runs-on: ${{ matrix.os }}
    env:
      MISE_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: rust python
      - name: Set the supported macOS deployment target
        if: runner.os == 'macOS'
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=15.0" >> "$GITHUB_ENV"
      - name: Configure Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          "CMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/ci/windows-msvc.cmake" >> $env:GITHUB_ENV
      - name: Install Linux x86 assembler
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
      - name: Install macOS x86 assembler
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          if brew tap | grep -Fxq aws/tap; then
            brew untap --force aws/tap
          fi
          brew install nasm
          echo "IMGLEAN_NASM=$(brew --prefix nasm)/bin/nasm" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/ci/nasm" >> "$GITHUB_PATH"
      - name: Build ImgLean once for all provider checks
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Build and exercise every external provider
        run: python tools/run_provider_ci.py --binary ${{ matrix.binary }}

  compliance:
    name: Compliance and reproducible corpora
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install native corpus build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
      - name: Verify every generated format corpus
        shell: bash
        run: |
          python tools/generate_png_corpus.py
          python tools/generate_jpeg_corpus.py
          python tools/generate_modern_corpus.py
          changes=$(git status --porcelain --untracked-files=all -- tests/corpus)
          if test -n "$changes"; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Audit dependencies
        run: mise run audit
      - name: Verify generated notices
        shell: bash
        run: |
          mise run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Generate and validate SPDX SBOM
        shell: bash
        run: |
          mise run sbom
          python -m json.tool target/imglean.spdx.json >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-records
          path: |
            THIRD_PARTY_NOTICES.md
            target/imglean.spdx.json

  native-hardening:
    name: Fuzz and sanitizer hardening (Linux)
    runs-on: ubuntu-24.04
    env:
      MISE_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install_args: rust
      - name: Install pinned toolchains and native build tools
        shell: bash
        run: |
          nightly=$(tr -d '\r\n' < ci/rust-nightly-version.txt)
          rustup toolchain install "$nightly" --profile minimal --component rust-src
          cargo +"$RUSTUP_TOOLCHAIN" install --locked --version 0.13.2 cargo-fuzz
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nasm
      - name: Run native codec tests with AddressSanitizer
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          CC: gcc
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer
          CXX: g++
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
          RUST_TEST_THREADS: 2
          RUSTFLAGS: -Clink-arg=-lasan
        run: |
          asan_runtime=$(gcc -print-file-name=libasan.so)
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="env LD_PRELOAD=$asan_runtime"
          cargo test --locked --workspace --all-features --target x86_64-unknown-linux-gnu
      - name: Fuzz every format validator with AddressSanitizer
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
        run: |
          nightly=$(tr -d '\r\n' < ci/rust-nightly-version.txt)
          cargo +"$nightly" fetch --locked --manifest-path fuzz/Cargo.toml
          for format in png jpeg webp avif; do
            corpus="$RUNNER_TEMP/imglean-fuzz-$format"
            mkdir "$corpus"
            index=0
            while IFS= read -r fixture; do
              cp "$fixture" "$corpus/$index"
              index=$((index + 1))
            done < <(find "tests/corpus/$format" -type f ! -name README.md -print | sort)
            CARGO_NET_OFFLINE=true cargo +"$nightly" fuzz run \
              --fuzz-dir fuzz --sanitizer address "validate_$format" "$corpus" -- \
              -max_len=1048576 -max_total_time=15 -timeout=5
          done
