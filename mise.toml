[tools]
python = "3.13"
rust = { version = "latest", components = ["clippy", "rustfmt"] }
"cargo:cargo-about" = { version = "0.9.1", features = "cli" }
"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-sbom" = "0.10.0"

[tasks.format]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint every target and feature"
run = "cargo clippy --locked --workspace --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the complete test suite"
run = "cargo test --locked --workspace --all-features"

[tasks.check]
description = "Run all required development checks"
run = [
  { task = "format:check" },
  { task = "lint" },
  { task = "test" },
  { task = "homebrew:check" },
]

[tasks."homebrew:check"]
description = "Validate Homebrew formula generation"
run = "python -B tools/test_homebrew_formula.py"

[tasks.dev]
description = "Run the development CLI"
run = "cargo run --locked --"

[tasks.audit]
description = "Audit dependency advisories, licenses, duplicates, and sources"
# cargo-deny's --locked protects Cargo.lock; only --offline disables advisory fetches.
run = "cargo deny --locked check advisories bans licenses sources"

[tasks.notices]
description = "Generate bundled third-party notices"
run = "python tools/generate_notices.py"

[tasks.sbom]
description = "Generate an SPDX 2.3 software bill of materials"
run = "python tools/generate_sbom.py > target/imglean.spdx.json"
