[package]
name = "imglean-codecs"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unsafe_code = "deny"

[dependencies]
libc = "=0.2.191"
image-webp = "=0.2.4"
imglean-avif = { version = "=0.1.0", path = "../imglean-avif" }
libz-sys = { version = "=1.1.30", features = ["static"] }
libwebp-sys = "=0.14.4"
mozjpeg = { version = "=0.10.13", default-features = false }
mozjpeg-sys = { version = "=2.2.3", default-features = false, features = ["jpegtran"] }
ravif = { version = "=0.13.0", default-features = false }

[build-dependencies]
cc = "=1.10.0"
cmake = "=0.1.58"
