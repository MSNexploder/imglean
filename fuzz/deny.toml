[graph]
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "aarch64-unknown-linux-musl",
  "x86_64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
all-features = true

[licenses]
allow = ["0BSD", "Apache-2.0", "BSD-2-Clause", "MIT", "NCSA", "Zlib"]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "miniz_oxide@0.8.9", reason = "png 0.18.1 requires miniz_oxide 0.8 while flate2 1.1.10 requires 0.9; remove when png supports 0.9" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
